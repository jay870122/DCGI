<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法農場 SP 湊齊計算器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            font-size: 1.8rem;
        }
        .container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            background-color: #fff;
        }
        input[type="number"]:focus, select:focus {
            border-color: #3498db;
            outline: none;
        }
        #slotInfo {
            margin-top: 6px;
            font-size: 0.9em;
            color: #2980b9;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:active {
            transform: scale(0.98);
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success {
            background-color: #e8f8f5;
            border-left: 5px solid #1abc9c;
        }
        .error {
            background-color: #fdedec;
            border-left: 5px solid #e74c3c;
        }
        .info {
            background-color: #e3f2fd;
            border-left: 5px solid #2196f3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: white;
        }
        th, td {
            padding: 12px 10px;
            border: 1px solid #e0e0e0;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .note {
            font-size: 0.95em;
            color: #555;
            background-color: #fff3cd;
            border-left: 5px solid #ffecb5;
        }
        .note h3 {
            margin-top: 0;
            color: #856404;
        }
        .warning {
            color: #721c24;
            font-weight: bold;
            background-color: #f8d7da;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .highlight {
            color: #e67e22;
            font-weight: bold;
        }
        .schedule-table td, .schedule-table th {
            font-size: 0.92em;
        }
        .version-footer {
            text-align: center;
            font-size: 0.8em;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>✨ 魔法農場 SP 湊齊計算器</h1>

    <div class="container">
        <div class="form-group">
            <label for="currentSP">目前總 SP 值</label>
            <input type="number" id="currentSP" placeholder="例如: 10888887 (輸入後會自動判定等級)" min="0">
        </div>

        <div class="form-group">
            <label for="farmLevel">目前農場等級 (過濾無法購買的種子，並決定可同時種植欄位數)</label>
            <select id="farmLevel" onchange="updateSlotInfo()"></select>
            <div id="slotInfo"></div>
        </div>
        
        <div class="form-group">
            <label for="fertilizerCount">可用魔法肥料數量 (每袋固定減少 1 小時種植時間，同一株作物可疊加多袋)</label>
            <input type="number" id="fertilizerCount" value="0" min="0" placeholder="例如: 5">
        </div>

        <div class="form-group">
            <label>選擇計算模式：</label>
            <select id="calcMode" onchange="toggleMode()">
                <option value="auto">🎰 自動尋找最近的牌型組合</option>
                <option value="custom">🎯 手動輸入目標 SP</option>
            </select>
        </div>

        <!-- 自訂目標區塊 -->
        <div class="form-group" id="customGroup" style="display: none;">
            <label for="targetSP">目標總 SP 值</label>
            <input type="number" id="targetSP" placeholder="例如: 10888911" min="0">
        </div>

        <!-- 自動尋找區塊 -->
        <div class="form-group" id="autoGroup">
            <label for="targetCombo">選擇想要的有效組合</label>
            <select id="targetCombo">
                <option value="pair">一對 (例如 11XXXX)</option>
                <option value="twopair">兩對 (例如 1122XX)</option>
                <option value="three">三條 (例如 111XXX)</option>
                <option value="four">四條 (例如 1111XX)</option>
                <option value="fullhouse">俘虜 (包含三條及一對，例如 11122X)</option>
                <option value="five">五條 (例如 11111X)</option>
                <option value="six">六條 (例如 111111)</option>
                <option value="straight">順子 (連續六位數順序，例如 123456)</option>
            </select>
        </div>

        <button onclick="processCalculation()">開始計算</button>

        <div id="result"></div>
    </div>

    <div class="container note">
        <h3>💡 活動溫馨提示</h3>
        <ul>
            <li>活動只計算<strong>個位數至十萬位數共 6 位數字</strong>的組合（如 SP 為 44266724，則判定 `266724`）。</li>
            <li>農場總 SP 值不足 100,000 的玩家將<strong>不獲獎勵資格</strong>。</li>
            <li style="margin-top: 8px;"><span class="warning">注意：現時超級 TR 日活動內獲得的 25 TR 日箱子具有 SP 2025 UP 道具，請小心使用以免打亂計算數值！</span></li>
            <li style="margin-top: 8px;">計算結果已考慮您所選等級<strong>可同時種植的欄位數量</strong>，會安排多種作物並行種植以縮短總花費時間，並提供分批種植步驟。</li>
        </ul>
    </div>

    <div class="version-footer">版本 v2.3（修正：同一時間點種植數量會依欄位數上限自動拆批）</div>

            { lv: 40, name: "藍色花瓣", sp: 246020, slots: 21 }, { lv: 41, name: "深藍色花瓣", sp: 291020, slots: 21 }, { lv: 42, name: "紫色花瓣", sp: 341020, slots: 21 },

            { lv: 46, name: "綠色花", sp: 681020, slots: 23 }, { lv: 47, name: "藍色花", sp: 791020, slots: 23 }, { lv: 48, name: "深藍色花", sp: 911020, slots: 23 },
            { lv: 49, name: "紫色花", sp: 1041020, slots: 23 }, { lv: 50, name: "紅色果實", sp: 1341020, slots: 24 }, { lv: 51, name: "橙色果實", sp: 1741020, slots: 24 },
            { lv: 52, name: "黃色果實", sp: 2241020, slots: 24 }, { lv: 53, name: "綠色果實", sp: 2841020, slots: 25 }, { lv: 54, name: "藍色果實", sp: 3541020, slots: 25 },
            { lv: 55, name: "深藍色果實", sp: 4341020, slots: 25 }, { lv: 56, name: "紫色果實", sp: 5841020, slots: 25 }, { lv: 57, name: "紅色樹木", sp: 8041020, slots: 26 },
            { lv: 58, name: "橙色樹木", sp: 10941020, slots: 26 }, { lv: 59, name: "黃色樹木", sp: 14541020, slots: 26 }, { lv: 60, name: "綠色樹木", sp: 18841020, slots: 27 },
            { lv: 61, name: "藍色樹木", sp: 23841020, slots: 27 }, { lv: 62, name: "深藍色樹木", sp: 29541020, slots: 27 }, { lv: 63, name: "紫色樹木", sp: 36741020, slots: 27 }

        window.onload = function() {
            const levelSelect = document.getElementById('farmLevel');
            farmLevels.forEach(level => {
                const option = document.createElement('option');
                option.value = level.lv;
                option.textContent = `Lv.${level.lv} - ${level.name} (需要 ${level.sp.toLocaleString()} SP)`;
                levelSelect.appendChild(option);
            });
            levelSelect.value = 63;
            updateSlotInfo();

            document.getElementById('currentSP').addEventListener('input', function() {
                const sp = parseInt(this.value);
                if (!isNaN(sp)) {
                    let matchedLevel = 1;
                    for (let i = farmLevels.length - 1; i >= 0; i--) {
                        if (sp >= farmLevels[i].sp) {
                            matchedLevel = farmLevels[i].lv;
                            break;
                        }
                    }
                    document.getElementById('farmLevel').value = matchedLevel;
                    updateSlotInfo();
                }
            });
        };

        function getSlotsForLevel(lv) {
            const found = farmLevels.find(l => l.lv === lv);
            return found ? found.slots : 10;
        }

        function updateSlotInfo() {
            const lv = parseInt(document.getElementById('farmLevel').value) || 1;
            const slots = getSlotsForLevel(lv);
            document.getElementById('slotInfo').textContent = `🌱 此等級可同時種植 ${slots} 個欄位（會安排多種作物並行種植）`;
        }

        function toggleMode() {
            const mode = document.getElementById('calcMode').value;
            if (mode === 'custom') {
                document.getElementById('customGroup').style.display = 'block';
                document.getElementById('autoGroup').style.display = 'none';
            } else {
                document.getElementById('customGroup').style.display = 'none';
                document.getElementById('autoGroup').style.display = 'block';
            }
        }

        // 判斷是否符合牌型 (只看最後6位)
        function checkCombo(sp, type) {
            let s = String(sp).padStart(6, '0');
            let last6 = s.slice(-6);

            switch(type) {
                case 'six':
                    return /(\d)\1{5}/.test(last6);
                case 'five':
                    return /(\d)\1{4}/.test(last6);
                case 'four':
                    return /(\d)\1{3}/.test(last6);
                case 'three':
                    return /(\d)\1{2}/.test(last6);
                case 'pair':
                    return /(\d)\1/.test(last6);
                case 'twopair':
                    let tpMatch = last6.match(/(\d)\1.*?(\d)\2/);
                    return tpMatch && tpMatch[1] !== tpMatch[2];
                case 'fullhouse':
                    let fh1 = last6.match(/(\d)\1{2}.*?(\d)\2/);
                    let fh2 = last6.match(/(\d)\1.*?(\d)\2{2}/);
                    return (fh1 && fh1[1] !== fh1[2]) || (fh2 && fh2[1] !== fh2[2]);
                case 'straight':
                    const straights = ["123456","234567","345678","456789","012345","987654","876543","765432","654321","543210"];
                    return straights.includes(last6);
                default:
                    return false;
            }
        }

        function processCalculation() {
            const currentStr = document.getElementById('currentSP').value;
            if (!currentStr || isNaN(currentStr)) {
                showResult("請先輸入有效的目前 SP 值。", false);
                return;
            }
            const current = parseInt(currentStr);
            const mode = document.getElementById('calcMode').value;
            const userLevel = parseInt(document.getElementById('farmLevel').value) || 1;
            let target = 0;

            if (mode === 'custom') {
                const targetStr = document.getElementById('targetSP').value;
                if (!targetStr || isNaN(targetStr)) {
                    showResult("請輸入目標 SP 值。", false);
                    return;
                }
                target = parseInt(targetStr);
                if (target < current) {
                    showResult(`目標 SP (${target}) 小於目前 SP (${current})，農場無法減少 SP！`, false);
                    return;
                }
            } else {
                const comboType = document.getElementById('targetCombo').value;
                const comboName = document.getElementById('targetCombo').options[document.getElementById('targetCombo').selectedIndex].text;
                
                showResult("🔍 正在尋找最近的組合，請稍候...", true, false, 'info');
                
                let testSP = Math.max(100000, current);
                let found = false;
                
                // 往上搜尋符合牌型的 SP 且確保能以目前等級種子湊出
                for (let i = 0; i < 500000; i++) {
                    if (checkCombo(testSP, comboType)) {
                        let diffTest = testSP - current;
                        if (diffTest === 0 || (diffTest > 0 && canFormDiff(diffTest, userLevel))) {
                            target = testSP;
                            found = true;
                            break;
                        }
                    }
                    testSP++;
                }

                if (!found) {
                    showResult(`在合理範圍內找不到符合「${comboName}」且能以現有等級種子湊出的 SP，請嘗試手動輸入或提高等級。`, false);
                    return;
                }
            }

            setTimeout(() => {
                calculateSP(current, target, userLevel);
            }, 50);
        }

        // 測試特定差額是否能被湊出來
        function canFormDiff(diff, userLevel) {
            const availableCrops = crops.filter(crop => crop.lv <= userLevel);
            const bestCropForSP = {};
            availableCrops.forEach(crop => {
                if (!bestCropForSP[crop.sp] || crop.minutes < bestCropForSP[crop.sp].minutes) {
                    bestCropForSP[crop.sp] = crop;
                }
            });
            const availableSPs = Object.keys(bestCropForSP).map(Number);
            
            const dp = new Array(diff + 1).fill(Infinity);
            dp[0] = 0;
            for (let i = 0; i <= diff; i++) {
                if (dp[i] === Infinity) continue;
                for (let sp of availableSPs) {
                    if (i + sp <= diff) {
                        if (dp[i] + 1 < dp[i + sp]) {
                            dp[i + sp] = dp[i] + 1;
                        }
                    }
                }
            }
            return dp[diff] !== Infinity;
        }

        // 格式化分鐘數為「幾天 幾小時 幾分鐘」
        function formatDuration(minutes) {
            minutes = Math.round(minutes);
            if (minutes <= 0) return "0分鐘（即時）";
            const d = Math.floor(minutes / 1440);
            const h = Math.floor((minutes % 1440) / 60);
            const m = minutes % 60;
            let parts = [];
            if (d > 0) parts.push(d + "天");
            if (h > 0) parts.push(h + "小時");
            if (m > 0) parts.push(m + "分鐘");
            return parts.length ? parts.join(" ") : "0分鐘";
        }

        // 依「可同時種植欄位數」排程所有種植工作，回傳每筆工作的起訖時間與總完成時間 (makespan)
        // 採用 LPT (最長工作優先) 排程法：每次把耗時最長的工作，放進目前最早會空出來的欄位
        function scheduleFarm(jobs, slots) {
            const sorted = jobs.slice().sort((a, b) => b.minutes - a.minutes);
            const slotFree = new Array(slots).fill(0);
            const events = [];
            for (const job of sorted) {
                let minIdx = 0;
                for (let i = 1; i < slots; i++) {
                    if (slotFree[i] < slotFree[minIdx]) minIdx = i;
                }
                const start = slotFree[minIdx];
                const end = start + job.minutes;
                events.push({ name: job.name, start, end, fertUsed: job.fertUsed || 0 });
                slotFree[minIdx] = end;
            }
            const makespan = slotFree.length ? Math.max(...slotFree) : 0;
            return { events, makespan };
        }

        // 把排程事件依「開始時間」分組，變成一批一批的種植步驟
        function buildBatches(events, slots) {
            // 先依「開始時間」把事件分組
            const groups = new Map();
            for (const e of events) {
                if (!groups.has(e.start)) groups.set(e.start, []);
                groups.get(e.start).push(e);
            }
            const starts = Array.from(groups.keys()).sort((a, b) => a - b);

            const batches = [];
            for (const s of starts) {
                const evList = groups.get(s);
                // 同一個時間點最多只能用 slots 個欄位，超過的部分要拆成下一批（即使時間點相同）
                for (let i = 0; i < evList.length; i += slots) {
                    const chunk = evList.slice(i, i + slots);
                    const itemMap = new Map();
                    for (const e of chunk) {
                        const key = e.name + "__" + e.fertUsed;
                        if (!itemMap.has(key)) itemMap.set(key, { name: e.name, fertUsed: e.fertUsed, count: 0 });
                        itemMap.get(key).count++;
                    }
                    batches.push({ time: s, items: Array.from(itemMap.values()) });
                }
            }
            return batches;
        }

        function renderBatchesHTML(batches, slots, makespan) {
            let html = `<h4 style="margin-bottom:6px;">🪴 種植步驟（同時可用 ${slots} 個欄位，🧪N 代表該項要使用 N 袋魔法肥料）</h4>`;
            const MAX_SHOW = 20;
            let shown = batches;
            let omittedCount = 0;
            if (batches.length > MAX_SHOW) {
                const head = batches.slice(0, 15);
                const tail = batches.slice(-3);
                omittedCount = batches.length - head.length - tail.length;
                shown = { head, tail };
            }

            html += `<table class="schedule-table"><thead><tr><th>步驟</th><th>距開始時間</th><th>本次種植內容</th></tr></thead><tbody>`;

            function itemsToStr(items) {
                return items.map(it => {
                    return it.fertUsed > 0
                        ? `${it.name}🧪${it.fertUsed} x${it.count}`
                        : `${it.name} x${it.count}`;
                }).join("、");
            }

            function rowHTML(batch, idx) {
                const itemsStr = itemsToStr(batch.items);
                const timeLabel = batch.time === 0 ? "現在" : `+${formatDuration(batch.time)}`;
                return `<tr><td>第 ${idx} 批</td><td>${timeLabel}</td><td>${itemsStr}</td></tr>`;
            }

            if (Array.isArray(shown)) {
                shown.forEach((batch, i) => { html += rowHTML(batch, i + 1); });
            } else {
                shown.head.forEach((batch, i) => { html += rowHTML(batch, i + 1); });
                html += `<tr><td colspan="3" style="text-align:center; color:#999;">...（中間省略 ${omittedCount} 批，規律相同，持續補種即可）...</td></tr>`;
                const tailStartIdx = batches.length - shown.tail.length + 1;
                shown.tail.forEach((batch, i) => { html += rowHTML(batch, tailStartIdx + i); });
            }

            html += `</tbody></table>`;
            html += `<p style="font-size:0.85em; color:#7f8c8d; margin-top:8px;">*每批最多只能種下 ${slots} 株（等於可用欄位數），若同一時間點需要種植的數量超過 ${slots}，會自動拆成下一批依序操作，即使兩批時間標示相同。每批欄位空出後請立即補種下一批，才能達到最短總時間。標示 🧪N 的作物請在種下該批次時使用 N 袋魔法肥料（同一株可疊加多袋）。總步驟數：${batches.length} 批。</p>`;
            return html;
        }

        function calculateSP(current, target, userLevel) {
            const diff = target - current;

            if (diff === 0) {
                showResult(`🎉 恭喜！您目前的 SP [<span class="highlight">${current}</span>] 已經符合條件，不需要種植任何作物！`, true, true, 'success');
                return;
            }
            if (diff > 200000) {
                showResult(`需要補充的 SP 差距 (${diff}) 過大，計算可能會卡頓。<br>建議先隨意種植高 SP 作物，等差距縮小後再來計算。`, false, true);
                return;
            }

            const availableCrops = crops.filter(crop => crop.lv <= userLevel);
            
            if (availableCrops.length === 0) {
                showResult("目前的等級無法種植任何作物！", false);
                return;
            }

            // 同 SP 時，優先挑選生長時間最短的作物
            const bestCropForSP = {};
            availableCrops.forEach(crop => {
                if (!bestCropForSP[crop.sp] || crop.minutes < bestCropForSP[crop.sp].minutes) {
                    bestCropForSP[crop.sp] = crop;
                }
            });
            const availableSPs = Object.keys(bestCropForSP).map(Number).sort((a, b) => a - b);

            const dp = new Array(diff + 1).fill(Infinity);
            const choice = new Array(diff + 1).fill(-1);
            dp[0] = 0;

            for (let i = 0; i <= diff; i++) {
                if (dp[i] === Infinity) continue;
                for (let sp of availableSPs) {
                    if (i + sp <= diff) {
                        if (dp[i] + 1 < dp[i + sp]) {
                            dp[i + sp] = dp[i] + 1;
                            choice[i + sp] = sp;
                        }
                    }
                }
            }

            if (dp[diff] === Infinity) {
                showResult(`以您目前的等級解鎖的作物，無法剛好湊出差額 <strong>${diff}</strong> SP。<br>請嘗試微調目標，或是提升農場等級解鎖更多種子。`, false, true);
                return;
            }

            const cropCounts = {};
            let currDiff = diff;
            while (currDiff > 0) {
                const spUsed = choice[currDiff];
                if (cropCounts[spUsed]) {
                    cropCounts[spUsed]++;
                } else {
                    cropCounts[spUsed] = 1;
                }
                currDiff -= spUsed;
            }

            // 建立個別種植工作清單 (jobsList)，先不套用肥料
            let jobsList = [];
            for (let sp of Object.keys(cropCounts).map(Number).sort((a, b) => b - a)) {
                let crop = bestCropForSP[sp];
                let count = cropCounts[sp];
                for (let c = 0; c < count; c++) {
                    jobsList.push({ name: crop.name, sp: sp, minutes: crop.minutes, fertUsed: 0 });
                }
            }

            // 貪心分配魔法肥料：每袋固定減少 60 分鐘，同一株作物可以多次使用（疊加），
            // 每次都優先套用在「目前剩餘種植時間最長」的作物上，直到肥料用完或所有作物時間都已降到 0
            let remainingFertilizer = parseInt(document.getElementById('fertilizerCount').value) || 0;
            while (remainingFertilizer > 0) {
                let maxIdx = -1, maxVal = 0;
                for (let i = 0; i < jobsList.length; i++) {
                    if (jobsList[i].minutes > maxVal) {
                        maxVal = jobsList[i].minutes;
                        maxIdx = i;
                    }
                }
                if (maxIdx === -1) break; // 所有作物時間都已經是 0，多的肥料用不到了
                jobsList[maxIdx].minutes = Math.max(0, jobsList[maxIdx].minutes - 60);
                jobsList[maxIdx].fertUsed++;
                remainingFertilizer--;
            }

            // 依 SP 分組彙總，做成上方的作物總表
            let cropDetails = [];
            for (let sp of Object.keys(cropCounts).map(Number).sort((a, b) => b - a)) {
                let crop = bestCropForSP[sp];
                let count = cropCounts[sp];
                let groupJobs = jobsList.filter(j => j.sp === sp);
                let totalFinalMinutes = groupJobs.reduce((sum, j) => sum + j.minutes, 0);
                let totalFertBags = groupJobs.reduce((sum, j) => sum + j.fertUsed, 0);

                cropDetails.push({
                    name: crop.name,
                    sp: sp,
                    count: count,
                    originalTimeStr: crop.timeStr,
                    finalMinutes: totalFinalMinutes,
                    totalFertBags: totalFertBags
                });
            }

            // 依農場等級的可同時種植欄位數進行排程，算出最短總完成時間與分批步驟
            const slots = getSlotsForLevel(userLevel);
            const scheduleResult = scheduleFarm(jobsList, slots);
            const batches = buildBatches(scheduleResult.events, slots);

            let html = `<h3 style="margin-top:0; color:#16a085;">✅ 成功！目標 SP 為 <span class="highlight">${target}</span></h3>`;
            html += `<p style="font-size: 0.95em;">(目標判定數字為: <strong>${String(target).slice(-6)}</strong>)</p>`;
            html += `<p>距離目前還差 <strong>${diff}</strong> SP，需要種植的作物種類與數量如下：</p>`;
            html += `<table>
                        <thead>
                            <tr>
                                <th>作物名稱</th>
                                <th>單項 SP</th>
                                <th>需種植數量</th>
                                <th>原始時間</th>
                                <th>套用肥料後總耗時</th>
                                <th>共用肥料</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            for (let item of cropDetails) {
                html += `<tr>
                            <td><strong>${item.name}</strong></td>
                            <td>${item.sp}</td>
                            <td style="color:#2980b9; font-size:1.1em;"><strong>${item.count} 個</strong></td>
                            <td>${item.originalTimeStr}</td>
                            <td style="color: #e67e22; font-weight: bold;">${formatDuration(item.finalMinutes)}</td>
                            <td>${item.totalFertBags > 0 ? '🧪 ' + item.totalFertBags + ' 袋' : '-'}</td>
                         </tr>`;
            }
            
            html += `</tbody></table>`;
            html += `<p style="font-size:0.85em; color:#7f8c8d; margin-top:10px;">*註：若有 SP 相同的作物，系統已自動為您優先選擇生長時間最短的項目。</p>`;

            html += `<div style="margin-top:18px; padding:12px; background:#eafaf1; border-radius:6px;">
                        <p style="margin:0; font-size:1.05em;">⏱️ 若同時利用您目前等級的 <strong>${slots}</strong> 個種植欄位並行種植、收成後立刻補種，
                        <strong>最短總花費時間約為 ${formatDuration(scheduleResult.makespan)}</strong>。</p>
                      </div>`;

            html += renderBatchesHTML(batches, slots, scheduleResult.makespan);
            
            showResult(html, true, true, 'success');
        }

        function showResult(message, isSuccess, isHTML = false, typeClass = null) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.classList.remove('success', 'error', 'info');
            
            if (typeClass) {
                resultDiv.classList.add(typeClass);
            } else {
                resultDiv.classList.add(isSuccess ? 'success' : 'error');
            }
            
            if (isHTML) {
                resultDiv.innerHTML = message;
            } else {
                resultDiv.innerText = message;
            }
        }
    </script>
</body>
</html>
